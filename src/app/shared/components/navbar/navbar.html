<header class="site-header">
  <nav class="nav-shell" aria-label="Navegação principal" (keydown.escape)="closeMenu()">
    <a class="brand" href="#inicio" (click)="closeMenu()" aria-label="Raí Abreu Machado, início">
      <span class="brand-mark" aria-hidden="true">
        <img src="/favicon.svg" alt="" width="52" height="40" />
      </span>
      <span class="brand-name">Raí Abreu<br />Machado</span>
    </a>

    <div class="nav-links">
      @for (item of navigation; track item.href) {
        <a [href]="item.href">{{ item.label }}</a>
      }
    </div>

    <div class="nav-actions">
      <button
        class="theme-button"
        type="button"
        [attr.aria-label]="darkTheme() ? 'Ativar tema claro' : 'Ativar tema escuro'"
        [attr.title]="darkTheme() ? 'Ativar tema claro' : 'Ativar tema escuro'"
        (click)="toggleTheme()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          @if (darkTheme()) {
            <circle cx="12" cy="12" r="4" fill="currentColor" stroke="none" />
            <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" />
          } @else {
            <path d="M20.985 12.486A9 9 0 0 1 11.514 3.015a9 9 0 1 0 9.47 9.47Z" />
          }
        </svg>
        <span class="theme-label">{{ darkTheme() ? 'Tema claro' : 'Tema escuro' }}</span>
      </button>

      <a class="contact-link" href="#contato">
        <span>Contato</span>
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3 13 13 3M6 3h7v7" />
        </svg>
      </a>

      <button
        class="menu-button"
        type="button"
        [attr.aria-label]="menuOpen() ? 'Fechar menu de navegação' : 'Abrir menu de navegação'"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-navigation"
        [class.is-open]="menuOpen()"
        (click)="onClickToggleMenu()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          @if (menuOpen()) {
            <path d="M5 5l14 14M19 5 5 19" />
          } @else {
            <path d="M4 6.5h16M4 12h16M4 17.5h16" />
          }
        </svg>
      </button>
    </div>

    @if (menuOpen()) {
      <div class="mobile-nav" id="mobile-navigation">
        @for (item of navigation; track item.href) {
          <a [href]="item.href" (click)="closeMenu()">{{ item.label }}</a>
        }
        <a href="#contato" (click)="closeMenu()">Contato</a>
      </div>
    }
  </nav>
</header>
